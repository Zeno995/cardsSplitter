name: cards_splitter
description: "App per gestire i conti dei giochi natalizi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_dynamic_links: ^6.0.12
  
  # State Management
  provider: ^6.1.2
  
  # Utils
  uuid: ^4.5.1
  share_plus: ^10.1.3
  go_router: ^14.6.2
  google_sign_in: ^6.2.2
  intl: ^0.19.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
